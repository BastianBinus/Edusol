name: CI

# Deployt wird über die Vercel-Git-Integration (vercel.json).
# Dieser Workflow prüft jeden Push und Pull Request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Blockierend nur für Laufzeit-Abhängigkeiten (landen in der Vercel Function).
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      # Build-Werkzeuge: sichtbar melden, aber nicht blockieren – Lücken ohne Patch
      # (z. B. braces via eleventy/chokidar, GHSA-vfj7-8cjw-p6xm) würden sonst jede Prüfung stoppen.
      - name: Audit dev dependencies (Hinweis)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Unit tests (Kontakt-API)
        run: npm run check:api

      - name: Build
        run: npm run build

      - name: Validate HTML
        run: npm run check:html

      - name: Check links
        run: npm run check:links

      - name: Check security headers
        run: npm run check:headers

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe)
        run: npm run check:a11y

      - name: Contact form (E2E)
        run: npm run check:form

      - name: UI interactions (E2E)
        run: npm run check:ui

      - name: Contact form via own API (E2E)
        run: npm run check:form:vercel

      - name: Lighthouse CI (Budgets)
        run: npx -y @lhci/cli@0.15.1 autorun

      - name: Report placeholders
        run: npm run check:placeholders
